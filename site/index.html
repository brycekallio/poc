<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POC — Prompt Optimization Coach</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0a0c10; color: #e6e8ee; padding: 24px;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main { max-width: 34rem; }
      h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 .5rem; }
      p { color: #9aa3b2; }
      kbd {
        background: #181c26; border: 1px solid #262b38; border-radius: 5px;
        padding: 2px 6px; font: 13px ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Prompt Optimization Coach</h1>
      <p>
        A better draft, wherever you write. Hover the dot beside your cursor in any
        text box, answer a few quick questions, and P.O.C writes a sharper version
        back into the box. Free with Ollama, or use your own AI key.
      </p>
      <p><a href="https://github.com/brycekallio/poc">Get it on GitHub</a></p>
    </main>
  </body>
</html>
