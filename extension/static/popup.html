<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>P.O.C</title>
    <style>
      /* The toolbar popup: is P.O.C on for this site, and the one switch.
         Same tokens as options.html (achromatic ledger): ink chrome, the one
         hue on the o of the mark. */
      @font-face { font-family: "Geist"; src: url(fonts/Geist-Regular.woff2) format("woff2"); font-weight: 400; }
      @font-face { font-family: "Geist"; src: url(fonts/Geist-Medium.woff2) format("woff2"); font-weight: 500; }
      @font-face { font-family: "Geist"; src: url(fonts/Geist-SemiBold.woff2) format("woff2"); font-weight: 600; }
      :root {
        color-scheme: light dark;
        --ground: #ffffff; --sunk: #f2f4f7; --raised: #eceef2;
        --text: #0a0a0a; --muted: #5f6670;
        --primary: #141414; --on-primary: #ffffff;
        --hue: #1d5fbf; --positive: #247b50;
        --font: "Geist", Inter, system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #111111; --sunk: #000000; --raised: #222222;
          --text: #ffffff; --muted: #b4b4b4;
          --primary: #ffffff; --on-primary: #0a0a0a;
          --hue: #6ea2f0; --positive: #3fc07a;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; width: 300px; background: var(--ground); color: var(--text); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
      button { font: inherit; color: inherit; cursor: pointer; }
      :focus-visible { outline: 2px solid var(--hue); outline-offset: 2px; }

      .wm { display: inline-flex; align-items: center; font-weight: 600; font-size: 16px; line-height: 1; letter-spacing: -0.01em; }
      .wm-o { display: inline-block; width: .56em; height: .56em; margin: .1em .05em 0; border-radius: 50%; background: var(--hue); }
      header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
      .settings { padding: 0; border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
      .settings:hover { color: var(--text); }

      main { padding: 14px 16px 16px; }
      .site { margin: 0 0 2px; font-size: 16px; line-height: 24px; font-weight: 500; overflow-wrap: anywhere; }
      .state { margin: 0; color: var(--muted); }
      .state.on { color: var(--positive); }
      .btn { width: 100%; height: 36px; margin-top: 14px; border: 0; border-radius: 6px; background: var(--primary); color: var(--on-primary); font-weight: 500; transition: opacity 120ms, transform 80ms; }
      .btn:hover { opacity: .88; }
      .btn:active { transform: scale(0.98); }
      .quiet { margin-top: 12px; padding: 0; border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
      .quiet:hover { color: var(--text); }
      .note { margin: 12px 0 0; padding: 10px 12px; border-radius: 6px; background: var(--sunk); color: var(--muted); font-size: 12px; line-height: 16px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <span class="wm" role="img" aria-label="P.O.C">p<span class="wm-o" aria-hidden="true"></span>c</span>
      <button class="settings" type="button" id="settings">Settings</button>
    </header>
    <main>
      <p class="site" id="site">This page</p>
      <p class="state" id="state">Checking…</p>
      <button class="btn" type="button" id="enable" hidden>Use P.O.C on this site</button>
      <button class="quiet" type="button" id="disable" hidden>Turn off on this site</button>
      <p class="note" id="note" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
